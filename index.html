function ukDate(iso){
  if (!iso) return "";
  const p = iso.split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
}

/* A game's stat line (100+/180/LD/HF/F9/AVG) is normally computed from
   leg.visits by sideStats(). game.statOverride[side], when present, replaces
   it wholesale - for fixing the final figures directly when nobody has the
   leg-by-leg history to reconstruct, just what the board should have read. */
function displayStats(game, side){
  const st = sideStats(game, side);
  const ov = game.statOverride && game.statOverride[side];
  if (!ov) return st;
  return { t100: ov.t100, t180: ov.t180, ld: ov.ld, high: ov.high, f9: ov.f9, avg: ov.avg };
}

function reportCard(game, n, gi){
  const half = (side) => {
    const won = game.won === side;
    const decided = game.won !== null;
    const st = displayStats(game, side);
    const rawNames = game[side] || [];
    let namesHtml = "To be named";
    if (rawNames.length){
      namesHtml = rawNames.map(name => {
        const found = getSquadStats(MATCHES_DATA).find(x => isSamePlayer(x.player, name.trim()));
        if (found){
          const branding = getPlayerBranding(found.player);
          const nickTag = branding ? (' <span class="smd-nickname-tag" style="font-size:9.5px;padding:1px 5px;background:' + esc(branding.accentColor || '#64748b') + '22;border:1px solid ' + esc(branding.accentColor || '#64748b') + '55;color:' + esc(branding.accentColor || '#64748b') + '">&ldquo;' + esc(branding.nickname) + '&rdquo;</span>') : '';
          return '<span class="player-link" data-act="player-profile" data-player="' + esc(found.player) + '" title="View ' + esc(found.player) + ' Profile">' + esc(name.trim()) + nickTag + '</span>';
        }
        return esc(name);
      }).join(" &amp; ");
    }
    const team = side === "home" ? S.viewing.homeTeam : S.viewing.awayTeam;
    const cols = [
      ["100+", st.t100 || 0],
      ["180",  st.t180 || "-"],
      ["LD",   st.ld   || "-"],
      ["HF",   st.high || "-"],
      ["F9",   avg2(st.f9)],
      ["AVG",  avg2(st.avg)]
    ];
    return '<div class="half">'
      + '<div class="top">'
      + '<span class="bdg ' + (won ? "w" : "l") + '">' + (decided ? (won ? "W" : "L") : "&#183;") + '</span>'
      + '<span class="nm"><b>' + namesHtml + '</b><span>' + esc(team) + '</span></span>'
      + '<span class="lg num">' + legsWonBy(game, side) + '</span>'
      + '</div>'
      + '<button class="stats" data-act="editstats" data-gi="' + gi + '" data-side="' + side + '">'
      + cols.map(c => '<div><span class="k">' + c[0] + '</span><span class="v">' + c[1] + '</span></div>').join("")
      + '</button>'
      + '<div class="uline' + (won ? " w" : "") + '"></div></div>';
  };
  return '<div class="gcard"><div class="gh">' + esc(n) + '</div>'
    + '<div class="gsplit">' + half("home") + '<div class="gap"></div>' + half("away") + '</div></div>';
}

function shareText(fx){
  const h = matchWonBy(fx,"home"), a = matchWonBy(fx,"away");
  const L = [];
  L.push(fx.homeTeam.toUpperCase() + " " + h + " - " + a + " " + fx.awayTeam.toUpperCase());
  L.push(fmtDate(fx.date) + (fx.venue ? " · " + fx.venue : ""));
  if (gallonPlayed(fx)) L.push("Gallon " + gallonLegsBy(fx,"home") + " - " + gallonLegsBy(fx,"away"));
  L.push("");
  fx.games.forEach((g,i) => {
    if (!g.started) return;
    const tag = i === 0 ? "Gallon" : "Game " + i;
    L.push(tag + ": " + (g.home.join(" & ")) + " " + legsWonBy(g,"home") + "-" + legsWonBy(g,"away") + " " + (g.away.join(" & ")));
  });
  const stats = fixtureStats(fx).filter(p => p.darts > 0);
  const maxes = stats.filter(p => p.t180).sort((x,y) => y.t180 - x.t180);
  const outs  = stats.slice().sort((x,y) => y.high - x.high)[0];
  const top   = stats.slice().sort((x,y) => y.avg - x.avg)[0];
  L.push("");
  if (maxes.length) L.push("180s: " + maxes.map(p => p.name + " (" + p.t180 + ")").join(", "));
  if (outs && outs.high) L.push("High checkout: " + outs.name + " " + outs.high);
  if (top && top.avg) L.push("Top average: " + top.name + " " + top.avg.toFixed(1));
  return L.join("\n");
}

/* Renders the match report to a PNG so it can go straight into WhatsApp. */
async function exportImage(fx){
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}

  const played  = fx.games.filter(g => g.started);
  const gallon  = played.filter(g => g.kind === "doubles");
  const singles = played.filter(g => g.kind === "singles");

  const P = 14, W = 580, CW = W - P*2;
  const HEAD_H = 74;
  const GH = 24, BODY = 52, STATS = 40, UL = 3, CARD = GH + BODY + STATS + UL, GAPY = 10, SECT = 34;
  const GAL = gallonPlayed(fx) ? 28 : 0;
  let H = P + HEAD_H + 62 + GAL;
  if (gallon.length)  H += SECT + gallon.length  * (CARD + GAPY);
  if (singles.length) H += SECT + singles.length * (CARD + GAPY);
  H += 36 + P;

  const s = 2;
  const cv = document.createElement("canvas");
  cv.width = W * s; cv.height = H * s;
  const x = cv.getContext("2d");
  x.scale(s, s);
  x.textBaseline = "alphabetic";

  const BODYF = "Barlow, system-ui, -apple-system, sans-serif";
  const CONDF = "'Barlow Condensed', Barlow, system-ui, sans-serif";
  const DISPF = "Anton, 'Arial Narrow', system-ui, sans-serif";
  const box = (col, X, Y, w, h) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
  const put = (t, X, Y, col, font, align, sp) => {
    x.fillStyle = col; x.font = font; x.textAlign = align || "left";
    try { x.letterSpacing = (sp || 0) + "px"; } catch(e){}
    x.fillText(String(t), X, Y);
    try { x.letterSpacing = "0px"; } catch(e){}
  };
  const clip = (t, font, max) => {
    x.font = font;
    if (x.measureText(t).width <= max) return t;
    let out = t;
    while (out.length > 1 && x.measureText(out + "\u2026").width > max) out = out.slice(0, -1);
    return out + "\u2026";
  };

  let badgeImg = null;
  const badgeSrc = S.badge || BADGE_DEFAULT;
  if (badgeSrc) { try { badgeImg = await loadImg(badgeSrc); } catch(e){} }

  box("#0B0D0B", 0, 0, W, H);
  let y = P;

  // header
  box("#F2F2F0", P, y, CW, HEAD_H);
  if (badgeImg && badgeImg.width && badgeImg.height){
    const bs = 52, k = Math.min(bs / badgeImg.width, bs / badgeImg.height);
    const bw = badgeImg.width * k, bh = badgeImg.height * k;
    try {
      x.drawImage(badgeImg, P + 14, y + (HEAD_H - bh)/2, bw, bh);
      x.drawImage(badgeImg, P + CW - 14 - bw, y + (HEAD_H - bh)/2, bw, bh);
    } catch(e){}
  }
  put("Match Report" + (fx.comp ? " - " + fx.comp : ""), W/2, y + 34, "#141614", "700 19px " + BODYF, "center");
  put(ukDate(fx.date) + (fx.venue ? "  \u00B7  " + fx.venue : ""), W/2, y + 53, "#6B6E6B", "400 13px " + BODYF, "center");
  y += HEAD_H;

  // scoreline
  const hw = matchWonBy(fx,"home"), aw = matchWonBy(fx,"away");
  box("#191D19", P, y, CW, 62);
  const mid = W/2, gap = 13;
  x.font = "400 31px " + DISPF;
  const nw = Math.max(x.measureText(String(hw)).width, x.measureText(String(aw)).width, 18);
  put(hw, mid - gap/2 - nw/2, y + 36, hw > aw ? "#C9A227" : "#F2F2F0", "400 31px " + DISPF, "center");
  put("\u2013", mid, y + 32, "#7C7F7C", "400 16px " + BODYF, "center");
  put(aw, mid + gap/2 + nw/2, y + 36, aw > hw ? "#C9A227" : "#F2F2F0", "400 31px " + DISPF, "center");
  put("MATCH", mid, y + 51, "#7C7F7C", "600 9.5px " + CONDF, "center", 1.6);
  const tf = "700 16px " + BODYF;
  put(clip(fx.homeTeam, tf, CW/2 - 60), mid - gap/2 - nw/2 - 22, y + 33, "#F2F2F0", tf, "right");
  put(clip(fx.awayTeam, tf, CW/2 - 60), mid + gap/2 + nw/2 + 22, y + 33, "#F2F2F0", tf, "left");
  y += 62;

  if (GAL){
    const gh = gallonLegsBy(fx,"home"), ga = gallonLegsBy(fx,"away");
    box("#141814", P, y, CW, GAL);
    const gf = "400 17px " + DISPF;
    x.font = gf;
    const gw = x.measureText(gh + " \u2013 " + ga).width;
    put("GALLON", mid - gw/2 - 10, y + 19, "#7C7F7C", "600 10.5px " + CONDF, "right", 1.5);
    put(gh, mid - 13, y + 20, gh > ga ? "#C9A227" : "#F2F2F0", gf, "center");
    put("\u2013", mid, y + 19, "#7C7F7C", "400 12px " + BODYF, "center");
    put(ga, mid + 13, y + 20, ga > gh ? "#C9A227" : "#F2F2F0", gf, "center");
    y += GAL;
  }

  const halfW = (CW - 2) / 2;

  const drawHalf = (game, side, hx, ty) => {
    const won = game.won === side, decided = game.won !== null;
    const st = displayStats(game, side);
    box("#191D19", hx, ty, halfW, BODY + STATS);

    // W / L badge
    x.beginPath(); x.arc(hx + 24, ty + 26, 13, 0, Math.PI*2);
    x.fillStyle = won ? "#C9A227" : "#6E726E"; x.fill();
    put(decided ? (won ? "W" : "L") : "\u00B7", hx + 24, ty + 31, won ? "#141614" : "#E8E8E6", "700 13px " + BODYF, "center");

    const nameF = "700 15px " + BODYF;
    const legs = String(legsWonBy(game, side));
    x.font = "400 28px " + DISPF;
    const legW = x.measureText(legs).width;
    const nameMax = halfW - 44 - legW - 20;
    put(clip((game[side] || []).join(" & ") || "To be named", nameF, nameMax), hx + 43, ty + 25, "#F2F2F0", nameF, "left");
    put(clip(side === "home" ? fx.homeTeam : fx.awayTeam, "400 11.5px " + BODYF, nameMax), hx + 43, ty + 41, "#8A8D8A", "400 11.5px " + BODYF, "left");
    put(legs, hx + halfW - 12, ty + 38, "#F2F2F0", "400 28px " + DISPF, "right");

    // stats strip
    const sy = ty + BODY;
    box("#262A26", hx, sy, halfW, 1);
    const cols = [
      ["100+", st.t100 || 0],
      ["180",  st.t180 || "-"],
      ["LD",   st.ld   || "-"],
      ["HF",   st.high || "-"],
      ["F9",   avg2(st.f9)],
      ["AVG",  avg2(st.avg)]
    ];
    const cwid = halfW / cols.length;
    cols.forEach((c, i) => {
      const cx = hx + cwid * i + cwid/2;
      if (i) box("#262A26", hx + cwid * i, sy + 1, 1, STATS - 1);
      put(c[0], cx, sy + 15, "#7C7F7C", "500 9.5px " + CONDF, "center");
      put(c[1], cx, sy + 31, "#F2F2F0", "600 13px " + BODYF, "center");
    });
    box(won ? "#C9A227" : "#4A4E4A", hx, ty + BODY + STATS, halfW, UL);
  };

  const drawCard = (game, label, ty) => {
    box("#F2F2F0", P, ty, CW, GH);
    put(label.toUpperCase(), W/2, ty + 16, "#141614", "700 11px " + CONDF, "center", 1.4);
    drawHalf(game, "home", P, ty + GH);
    drawHalf(game, "away", P + halfW + 2, ty + GH);
  };

  const section = (label) => {
    put(label.toUpperCase(), W/2, y + 22, "#7C7F7C", "600 11.5px " + CONDF, "center", 1.5);
    y += SECT;
  };

  if (gallon.length){
    section("The Gallon (doubles, best of 3 legs of 501)");
    gallon.forEach(g => { drawCard(g, "The Gallon", y); y += CARD + GAPY; });
  }
  if (singles.length){
    section("Singles (best of 5 legs of 501)");
    singles.forEach((g, i) => { drawCard(g, "Game " + (i+1), y); y += CARD + GAPY; });
  }

  put("LD least darts  \u00B7  HF highest finish  \u00B7  F9 first nine average",
      W/2, y + 16, "#5E625E", "400 11.5px " + BODYF, "center");

  // Watermark - top/bottom strips plus vertical text up each side, all
  // sitting in the existing 14px margin (P) so nothing else needs to move.
  x.save();
  x.globalAlpha = 1.0;
  x.fillStyle = "rgba(255, 255, 255, 0.92)";
  x.font = "700 11.5px " + CONDF;
  x.textAlign = "center";
  try { x.letterSpacing = "2.75px"; } catch(e){}
  x.fillText("PWMC CHALK APP", W/2, 10);
  x.fillText("PWMC CHALK APP", W/2, H - 4);
  x.save(); x.translate(8, H/2); x.rotate(-Math.PI/2); x.fillText("PWMC CHALK APP", 0, 0); x.restore();
  x.save(); x.translate(W - 8, H/2); x.rotate(Math.PI/2); x.fillText("PWMC CHALK APP", 0, 0); x.restore();
  try { x.letterSpacing = "0px"; } catch(e){}
  x.restore();

  const name = (fx.homeTeam + " v " + fx.awayTeam + " " + ukDate(fx.date)).replace(/[\/\\:*?"<>|]/g, "-") + ".png";
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  if (!blob) throw new Error("no blob");

  const file = new File([blob], name, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    await navigator.share({ files: [file], title: fx.homeTeam + " v " + fx.awayTeam });
    return "shared";
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return "saved";
}

/* =======================================================================
   6. ACTIONS
   ======================================================================= */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "toggle-theme"){
    S.theme = (S.theme === "light") ? "dark" : "light";
    try {
      await store.set(KEY_THEME, S.theme);
      localStorage.setItem(KEY_THEME, S.theme);
    } catch(err){}
    applyTheme();
    render();
    return;
  }

  if (act === "badge"){
    const inp = document.getElementById("badge-file");
    if (inp) inp.click();
    return;
  }
  if (act === "badge-clear"){
    await store.set(KEY_BADGE, null);
    S.badge = await siteLogo();          // falls back to the team logo if there is one
    applyIcons(); render();
    toast("Badge removed");
    return;
  }

  if (act === "new"){ S.view = "setup"; render(); return; }
  if (act === "results"){ S.view = "results"; render(); return; }
  if (act === "smd"){ S.view = "smd"; render(); return; }
  if (act === "preview"){ S.viewing = S.fx; S.view = "view"; render(); return; }

  if (act === "smd-sort"){
    const key = el.dataset.k;
    if (S.smdSort.key === key){
      S.smdSort.dir = S.smdSort.dir === "desc" ? "asc" : "desc";
    } else {
      S.smdSort.key = key;
      S.smdSort.dir = (key === "ld" || key === "player") ? "asc" : "desc";
    }
    render(); return;
  }
  if (act === "smd-viewmode"){
    S.smdViewMode = el.dataset.mode;
    render(); return;
  }
  if (act === "smd-toggle"){
    const p = el.dataset.player;
    const curr = S.smdExpanded[p] !== false;
    S.smdExpanded[p] = !curr;
    render(); return;
  }
  if (act === "smd-expand-all"){
    getSquadStats(MATCHES_DATA).forEach(p => { S.smdExpanded[p.player] = true; });
    render(); return;
  }
  if (act === "smd-collapse-all"){
    getSquadStats(MATCHES_DATA).forEach(p => { S.smdExpanded[p.player] = false; });
    render(); return;
  }
  if (act === "smd-clear-search"){
    S.smdSearch = "";
    render(); return;
  }

  if (act === "player-profile"){
    const pName = el.dataset.player;
    const found = getPlayerBySlugOrName(pName);
    if (found){
      S.selectedPlayer = found.player;
      S.playerPrevView = (S.view === "player" ? S.playerPrevView : S.view) || "smd";
      S.view = "player";
      try { window.location.hash = "#/player/" + slugify(found.player); } catch(e){}
      render();
    }
    return;
  }

  if (act === "view-fixture-report"){
    const fxId = el.dataset.id;
    const targetFx = (S.fixtures || []).find(f => f.id === fxId);
    if (targetFx){
      S.viewing = targetFx;
      S.playerPrevView = "player";
      S.view = "view";
      render();
    }
    return;
  }

  if (act === "back"){
    if (S.view === "player"){
      S.view = S.playerPrevView || "smd";
      try { window.location.hash = S.view === "smd" ? "#/smd" : ""; } catch(e){}
    }
    else if (S.view === "setup" || S.view === "results" || S.view === "smd") S.view = "home";
    else if (S.view === "fixture") S.view = "home";
    else if (S.view === "lineup" || S.view === "board") S.view = "fixture";
    else if (S.view === "view"){
      if (S.playerPrevView === "player"){
        S.view = "player";
        S.playerPrevView = "smd";
      } else {
        const previewingLive = S.viewing && S.fx && S.viewing.id === S.fx.id && !S.fx.finished;
        S.view = previewingLive ? "fixture" : "results";
      }
    }
    else if (S.view === "watch") S.view = "home";
    render(); return;
  }

  if (act === "create"){
    const meta = {
      date: val("i-date"), venue: val("i-venue"), comp: val("i-comp"),
      homeTeam: val("i-hteam") || "Home", awayTeam: val("i-ateam") || "Away",
      homeSquad: lines("i-hsquad"), awaySquad: lines("i-asquad"),
      throwRule: val("i-throw") || "home"
    };
    S.squads = { venue: meta.venue, comp: meta.comp, throwRule: meta.throwRule, home:{team:meta.homeTeam, players:meta.homeSquad}, away:{team:meta.awayTeam, players:meta.awaySquad} };
    await store.set(KEY_SQ, S.squads);
    S.fx = blankFixture(meta);
    await persist();
    S.view = "fixture"; render(); return;
  }

  if (act === "resume"){
    S.fx = S.fixtures.find(f => f.id === el.dataset.id);
    S.view = "fixture"; render(); return;
  }

  if (act === "open"){
    S.gi = +el.dataset.i;
    const g = S.fx.games[S.gi];
    if (!g.started){ S.view = "lineup"; }
    else if (g.won !== null){ S.viewing = S.fx; S.view = "view"; }  // done - go to the report to review or correct it
    else { S.view = "board"; }
    render(); return;
  }

  if (act === "begin"){
    const g = S.fx.games[S.gi];
    const n = g.kind === "doubles" ? 2 : 1;
    const grab = (side, k) => val("t-" + side + k) || val("s-" + side + k);
    const home = [], away = [];
    for (let k = 0; k < n; k++){ home.push(grab("home", k)); away.push(grab("away", k)); }
    if (home.some(x => !x) || away.some(x => !x)){ toast("Every player needs a name"); return; }
    g.home = home; g.away = away; g.started = true;
    home.forEach(p => { if (!S.fx.homeSquad.includes(p)) S.fx.homeSquad.push(p); });
    away.forEach(p => { if (!S.fx.awaySquad.includes(p)) S.fx.awaySquad.push(p); });
    g.legs = [newLeg(val("s-start") || defaultStart(S.fx, S.gi))];
    await persist();
    S.entry = ""; S.error = ""; S.view = "board"; render(); return;
  }

  if (act === "key"){
    if (S.entry.length >= 3) return;
    const wasError = S.error; S.error = "";
    S.entry = (S.entry + el.dataset.k).replace(/^0+(?=\d)/, "");
    if (+S.entry > 180){ S.entry = S.entry.slice(0, -1); S.error = wasError; shake(); return; }
    if (wasError) render(); else softEntry();
    return;
  }
  if (act === "del"){
    const wasError = S.error;
    S.entry = S.entry.slice(0, -1); S.error = "";
    if (wasError) render(); else softEntry();
    return;
  }
  if (act === "quick"){ S.entry = el.dataset.n; S.error = ""; commit(); return; }
  if (act === "enter"){ commit(); return; }

  if (act === "undo"){
    const g = S.fx.games[S.gi];
    const leg = g.legs[g.legs.length - 1];
    if (undoVisit(g, leg)){ S.entry = ""; S.error = ""; await persist(); render(); }
    else toast("Nothing to undo in this leg");
    return;
  }

  if (act === "checkout"){
    const darts = +el.dataset.d;
    S.sheet = null;
    await finishVisit(+el.dataset.score, darts);
    return;
  }
  if (act === "notout"){ S.sheet = null; S.entry = ""; render(); return; }

  if (act === "nextleg"){
    S.sheet = null;
    const g = S.fx.games[S.gi];
    if (gameOver(g)){
      g.won = legsWonBy(g,"home") > legsWonBy(g,"away") ? "home" : "away";
      await persist();
      S.view = "fixture";
    } else {
      const last = g.legs[g.legs.length - 1];
      g.legs.push(newLeg(other(last.starter)));
      await persist();
    }
    S.entry = ""; render(); return;
  }

  if (act === "finish"){
    S.fx.finished = !S.fx.finished;
    await persist();
    if (S.fx.finished){ S.viewing = S.fx; S.view = "view"; }
    render(); return;
  }

  if (act === "golive"){ openLiveSheet("start"); return; }
  if (act === "takeover" || act === "watch-takeover"){ openLiveSheet("claim"); return; }

  if (act === "watch-continue"){
    S.fx = S.viewing;
    const i = S.fixtures.findIndex(f => f.id === S.fx.id);
    if (i >= 0) S.fixtures[i] = S.fx; else S.fixtures.unshift(S.fx);
    await store.set(KEY_FX, S.fixtures);
    S.view = "fixture"; render(); return;
  }

  if (act === "golive-confirm"){
    const name = val("live-name"), pin = val("live-pin");
    if (!name || !pin){ toast("Enter your name and the PIN"); return; }
    if (!sb){ toast("No connection - can't go live right now"); return; }
    try {
      const { data: token, error } = await sb.rpc("start_fixture", { p_id: S.fx.id, p_pin: pin, p_name: name, p_data: S.fx });
      if (error || !token){ toast("Wrong PIN"); return; }
      S.fx.shared = true;
      S.session = { fixtureId: S.fx.id, name, token };
      await store.set(KEY_SESSION, S.session);
      await persist();
      subscribeFixture(S.fx.id);
      S.sheet = null;
      toast("You're live");
      render();
    } catch(e){ toast("Couldn't reach the server - try again"); }
    return;
  }

  if (act === "takeover-confirm"){
    const name = val("live-name"), pin = val("live-pin");
    if (!name || !pin){ toast("Enter your name and the PIN"); return; }
    if (!sb){ toast("No connection - can't take over right now"); return; }
    const fixtureId = S.view === "watch" ? S.viewing.id : S.fx.id;
    try {
      const { data: token, error } = await sb.rpc("claim_scoring", { p_id: fixtureId, p_pin: pin, p_name: name });
      if (error || !token){ toast("Wrong PIN, or someone else is actively scoring this"); return; }
      S.session = { fixtureId, name, token };
      await store.set(KEY_SESSION, S.session);
      const fresh = S.view === "watch" ? S.viewing : S.fx;
      fresh.shared = true;
      S.fx = fresh;
      const i = S.fixtures.findIndex(f => f.id === fresh.id);
      if (i >= 0) S.fixtures[i] = fresh; else S.fixtures.unshift(fresh);
      await store.set(KEY_FX, S.fixtures);
      subscribeFixture(fixtureId);
      S.sheet = null;
      S.view = "fixture";
      toast("You're scoring now");
      render();
    } catch(e){ toast("Couldn't reach the server - try again"); }
    return;
  }

  if (act === "sharelink"){
    const url = location.origin + location.pathname + "?watch=" + encodeURIComponent(S.fx.id);
    if (navigator.share){ try { await navigator.share({ title: S.fx.homeTeam + " v " + S.fx.awayTeam, url }); return; } catch(e){ return; } }
    try { await navigator.clipboard.writeText(url); toast("Link copied"); }
    catch(e){ toast(url); }
    return;
  }

  if (act === "show"){
    S.viewing = S.fixtures.find(f => f.id === el.dataset.id);
    S.view = "view"; render(); return;
  }

  if (act === "editstats"){
    openStatsEditor(+el.dataset.gi, el.dataset.side);
    return;
  }
  if (act === "closesheet"){ S.sheet = null; render(); return; }

  if (act === "savestats" || act === "clearstats"){
    const gi = +el.dataset.gi, side = el.dataset.side;
    const g = S.viewing.games[gi];
    g.statOverride = g.statOverride || {};
    if (act === "clearstats"){
      delete g.statOverride[side];
    } else {
      const num = (id) => { const raw = val(id); return raw === "" ? 0 : +raw; };
      g.statOverride[side] = {
        t100: num("stat-t100"), t180: num("stat-t180"),
        ld: num("stat-ld") || null, high: num("stat-hf") || null,
        f9: num("stat-f9"), avg: num("stat-avg")
      };
    }
    S.sheet = null;
    await persist(S.viewing);
    toast(act === "savestats" ? "Figures corrected" : "Back to the calculated figures");
    render(); return;
  }

  if (act === "export"){
    const btn = el;
    const was = btn.innerHTML;
    btn.innerHTML = "Exporting&hellip;"; btn.disabled = true;
    try {
      const how = await exportImage(S.viewing);
      if (how === "saved") toast("Image saved");
    } catch(err){
      try { await navigator.clipboard.writeText(shareText(S.viewing)); toast("Copied as text instead"); }
      catch(e2){ toast("Could not export"); }
    }
    btn.innerHTML = was; btn.disabled = false;
    return;
  }

  if (act === "share" || act === "copy"){
    const txt = shareText(S.viewing);
    if (act === "share" && navigator.share){
      try { await navigator.share({ title: S.viewing.homeTeam + " v " + S.viewing.awayTeam, text: txt }); } catch(err){}
      return;
    }
    try { await navigator.clipboard.writeText(txt); toast("Copied"); }
    catch(err){ toast("Could not copy"); }
    return;
  }
});

document.addEventListener("input", e => {
  if (e.target && e.target.id === "smd-search"){
    S.smdSearch = e.target.value;
    render();
    const inp = document.getElementById("smd-search");
    if (inp){
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }
});

function softEntry(){
  const n = document.getElementById("entry");
  if (n){ n.textContent = S.entry || "0"; n.classList.toggle("empty", !S.entry); }
  const h = document.querySelector(".hint");
  if (h && S.error === ""){ /* leave the checkout hint in place while typing */ }
}
function shake(){
  const n = document.getElementById("entry");
  if (n){ n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake"); }
}

function commit(){
  const g = S.fx.games[S.gi];
  const leg = g.legs[g.legs.length - 1];
  const score = +(S.entry || "0");

  if (S.entry === ""){ shake(); return; }
  if (!REACHABLE.has(score)){
    S.error = score + " cannot be thrown with three darts";
    shake(); render(); return;
  }
  const rem = leg.rem[leg.thrower];
  if (rem - score === 0){
    S.sheet = '<div class="veil"><div class="sheet"><h3>Game shot</h3>'
      + '<p>' + esc(thrower(g, leg)) + ' checked out ' + rem + '. How many darts did that take?</p>'
      + '<div class="row3">'
      + [1,2,3].map(d => '<button class="btn quiet" data-act="checkout" data-d="' + d + '" data-score="' + score + '">' + d + '</button>').join("")
      + '</div><button class="btn ghost" style="margin-top:12px" data-act="notout">That was wrong, go back</button></div></div>';
    render(); return;
  }
  finishVisit(score, 3);
}

async function finishVisit(score, darts){
  const g = S.fx.games[S.gi];
  const leg = g.legs[g.legs.length - 1];
  const name = thrower(g, leg);
  const outcome = applyVisit(g, leg, score, darts);
  S.entry = ""; S.error = "";

  if (outcome === "bust") S.error = "Bust";
  await persist();

  if (outcome === "won"){
    const won = legsWonBy(g,"home"), lost = legsWonBy(g,"away");
    const over = gameOver(g);
    const winners = leg.won === "home" ? g.home.join(" & ") : g.away.join(" & ");
    S.sheet = '<div class="veil"><div class="sheet"><h3>' + (over ? "Game to " : "Leg to ") + esc(winners) + '</h3>'
      + '<p>' + leg.winDarts + ' darts &middot; legs now ' + won + "&#8211;" + lost
      + (over ? "" : " &middot; " + esc(leg.starter === "home" ? S.fx.awayTeam : S.fx.homeTeam) + " throws first next leg") + '</p>'
      + '<button class="btn" data-act="nextleg">' + (over ? "Back to the fixture" : "Next leg") + '</button></div></div>';
  }
  render();
}

/* Editing a game's final figures directly, reached by tapping a report
   card's stats grid. This deliberately doesn't touch leg/visit data - it's
   for fixing the numbers on the report itself when nobody has (or needs)
   the leg-by-leg history to reconstruct them from. */
function openStatsEditor(gi, side){
  const g = S.viewing.games[gi];
  const st = displayStats(g, side);
  const team = side === "home" ? S.viewing.homeTeam : S.viewing.awayTeam;
  const names = (g[side] || []).join(" & ") || "To be named";
  const field = (id, label, value) =>
    '<label class="f"><span class="eyebrow">' + label + '</span><input type="text" inputmode="decimal" id="' + id + '" value="' + esc(String(value)) + '"></label>';
  S.sheet = '<div class="veil"><div class="sheet"><h3>Correct these figures</h3>'
    + '<p>' + esc(names) + ' &middot; ' + esc(team) + '</p>'
    + field("stat-t100", "100+", st.t100 || 0)
    + field("stat-t180", "180", st.t180 || 0)
    + field("stat-ld", "Least darts to win a leg", st.ld || 0)
    + field("stat-hf", "Highest finish", st.high || 0)
    + field("stat-f9", "First nine average", avg2(st.f9))
    + field("stat-avg", "Average", avg2(st.avg))
    + '<button class="btn" data-act="savestats" data-gi="' + gi + '" data-side="' + side + '">Save correction</button>'
    + (g.statOverride && g.statOverride[side] && (g.legs || []).some(l => l.visits && l.visits.length)
        ? '<button class="btn danger" style="margin-top:10px" data-act="clearstats" data-gi="' + gi + '" data-side="' + side + '">Back to calculated figures</button>'
        : '')
    + '<button class="btn ghost" style="margin-top:10px" data-act="closesheet">Cancel</button>'
    + '</div></div>';
  render();
}

/* =======================================================================
   6b. LIVE SYNC - go live / take over scoring / follow along
   ======================================================================= */

/* Same sheet for both "go live" (starting to share a fixture) and "take
   over" (claiming scoring control, whether nobody currently holds it, an
   existing lock has gone stale, or you're switching phones) - both need the
   same name + team PIN. */
function openLiveSheet(mode){
  const starting = mode === "start";
  S.sheet = '<div class="veil"><div class="sheet"><h3>' + (starting ? "Go live" : "Take over scoring") + '</h3>'
    + '<p>' + (starting
        ? "Anyone with the link can follow along from here. Enter your name and the team PIN to start scoring."
        : "Enter your name and the team PIN to take control of scoring.") + '</p>'
    + '<label class="f"><span class="eyebrow">Your name</span><input type="text" id="live-name" placeholder="e.g. Dave"></label>'
    + '<label class="f"><span class="eyebrow">Team PIN</span><input type="text" inputmode="numeric" id="live-pin" placeholder="PIN"></label>'
    + '<button class="btn" data-act="' + (starting ? "golive-confirm" : "takeover-confirm") + '">' + (starting ? "Go live" : "Take over") + '</button>'
    + '<button class="btn ghost" style="margin-top:10px" data-act="closesheet">Cancel</button>'
    + '</div></div>';
  render();
}

/* Subscribes to live changes for one fixture, so a viewer's (or a scorer's
   other tab's) copy updates the moment the current scorer saves. Silently
   does nothing without a connection - the watch screen just stays on
   whatever was last fetched until it reconnects. */
function subscribeFixture(fixtureId){
  if (!sb) return;
  if (S.remoteChannel){ try { sb.removeChannel(S.remoteChannel); } catch(e){} S.remoteChannel = null; }
  S.remoteChannel = sb.channel("fixture-" + fixtureId)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "fixtures", filter: "id=eq." + fixtureId },
      (payload) => {
        // Ignore the echo of this device's own writes - it already has the latest.
        if (S.session.token && S.session.fixtureId === fixtureId) return;
        const fresh = payload.new && payload.new.data;
        if (!fresh) return;
        if (S.watchId === fixtureId){ S.viewing = fresh; render(); }
      })
    .subscribe();
}

/* =======================================================================
   7. INSTALL PLUMBING
   ======================================================================= */
/* Turns whatever badge file they pick into a square PNG the phone can use
   as an app icon. Padded and mounted on the app's own dark ground so a
   transparent logo does not come out as a black square. */
function processBadge(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("could not read the file"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("that file is not an image we can draw"));
      img.onload = () => {
        try {
          const N = 512, c = document.createElement("canvas");
          c.width = c.height = N;
          const x = c.getContext && c.getContext("2d");
          if (!x) return reject(new Error("no canvas"));
          // Sample the source corner so the padding blends instead of framing it.
          let ground = "#1E2A26";
          try {
            const probe = document.createElement("canvas");
            probe.width = probe.height = 1;
            const px = probe.getContext("2d");
            px.drawImage(img, 0, 0, 1, 1);
            const d = px.getImageData(0, 0, 1, 1).data;
            if (d[3] > 200) ground = "rgb(" + d[0] + "," + d[1] + "," + d[2] + ")";
          } catch(err){}
          x.fillStyle = ground;
          x.fillRect(0, 0, N, N);
          const inset = N * 0.06, box = N - inset * 2;
          const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
          if (!iw || !ih) return reject(new Error("that image has no size we can read"));
          const k = Math.min(box / iw, box / ih);
          const w = iw * k, h = ih * k;
          x.drawImage(img, (N - w) / 2, (N - h) / 2, w, h);
          resolve(c.toDataURL("image/png"));
        } catch(err){ reject(err); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* A logo.png sitting next to index.html is the team-wide default, so nobody
   has to add the badge on their own phone. A badge chosen on the device wins. */
const loadImg = (src, ms) => new Promise(res => {
  let settled = false;
  const done = (v) => { if (settled) return; settled = true; clearTimeout(timer); res(v); };
  const timer = setTimeout(() => done(null), ms || 4000);
  const i = new Image();
  i.onload  = () => done(i);
  i.onerror = () => done(null);
  i.src = src;
});
const siteLogo = () => loadImg("./logo.png").then(i => i ? "./logo.png" : null);

/* The badge becomes the home screen icon too. Re-run whenever it changes. */
let manifestUrl = null;
function applyIcons(){
  try {
    let touch = document.querySelector('link[rel="apple-touch-icon"]');
    if (!touch){
      touch = document.createElement("link");
      touch.rel = "apple-touch-icon";
      document.head.appendChild(touch);
    }
    touch.href = S.badge || "icon-180.png";

    // manifest.json ships with the app and covers the normal case. Only when
    // someone picks their own badge do we need to build one on the fly, and
    // only if the browser supports it.
    const link = document.querySelector('link[rel="manifest"]');
    if (!link) return;
    if (!S.badge){ link.href = "manifest.json"; return; }
    if (!(window.URL && typeof URL.createObjectURL === "function")) return;

    const manifest = {
      name: "Chalk \u00B7 Darts Match Night", short_name: "Chalk",
      start_url: ".", scope: ".", display: "standalone",
      background_color: "#1E2A26", theme_color: "#1E2A26", orientation: "portrait",
      icons: [{ src: S.badge, sizes: "512x512", type: "image/png", purpose: "any" }]
    };
    if (manifestUrl) URL.revokeObjectURL(manifestUrl);
    manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/json" }));
    link.href = manifestUrl;
  } catch(e){ /* installing to the home screen is a bonus, never a blocker */ }
}

(function registerWorker(){
  try {
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  } catch(e){}
})();

function iconPng(size){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext && c.getContext("2d");
  if (!x) return "";
  const m = size / 100;
  x.fillStyle = "#1E2A26"; x.fillRect(0,0,size,size);
  const ring = (r, w, col, from, to) => {
    x.beginPath(); x.arc(size/2, size/2, r*m, from||0, to||Math.PI*2);
    x.lineWidth = w*m; x.strokeStyle = col; x.stroke();
  };
  ring(36, 11, "#3E5148");
  ring(36, 11, "#C8452F", -Math.PI/2 - 0.16, -Math.PI/2 + 0.16);
  ring(36, 11, "#C8452F", Math.PI/2 - 0.16, Math.PI/2 + 0.16);
  ring(21, 6, "#2F8F5B");
  ring(44, 2, "#B79B5B");
  x.beginPath(); x.arc(size/2, size/2, 8*m, 0, Math.PI*2); x.fillStyle = "#C8452F"; x.fill();
  x.beginPath(); x.arc(size/2, size/2, 3.4*m, 0, Math.PI*2); x.fillStyle = "#F2EFE4"; x.fill();
  return c.toDataURL("image/png");
}

if (badgeInput) badgeInput.addEventListener("change", async (e) => {

/* =======================================================================
   DEMO DATA - only active with ?demo=1 in the URL. Harmless to leave in for
   deployment (it does nothing unless that query string is present), but
   safe to delete this whole block plus the DEMO_MODE line in boot() below
   once you're done reviewing.
   ======================================================================= */
const DEMO_MODE = /(^|[?&])demo=1(&|$)/.test(location.search);

/* Plays out one leg with the real rules engine so the data is fully
   consistent - reuses checkoutRoute() for realistic finishes and dart
   counts, and occasionally scripts a deliberate bust for variety. */
function demoLeg(game, starter){
  const leg = newLeg(starter);
  let guard = 0;
  while (leg.won === null && guard++ < 60){
    const rem = leg.rem[leg.thrower];
    if (rem < 170 && Math.random() < 0.08){
      const over = [60,81,100,121,140,180].filter(s => s > rem);
      if (over.length){ applyVisit(game, leg, over[Math.floor(Math.random() * over.length)]); continue; }
    }
    if (rem <= 170){
      const route = checkoutRoute(rem);
      if (route && Math.random() < 0.65){ applyVisit(game, leg, rem, route.length); continue; }
      const opts = [26,41,45,60,66,81,85,96].filter(s => s < rem && rem - s !== 1);
      applyVisit(game, leg, opts.length ? opts[Math.floor(Math.random() * opts.length)] : 26);
      continue;
    }
    const bigs = [45,60,81,100,121,134,140,155,164,180];
    applyVisit(game, leg, bigs[Math.floor(Math.random() * bigs.length)]);
  }
  return leg;
}

function buildDemoFixture(){
  const meta = {
    date: new Date().toISOString().slice(0,10),
    venue: "The Anchor", comp: "League",
    homeTeam: "The Anchor", awayTeam: "The Feathers",
    homeSquad: ["Dave Whitlow","Mick Sanders","Baz O'Connor","Steve Ridge","Ray Fenwick"],
    awaySquad: ["Paul Ainsworth","Gaz Doyle","Col Metters","Nick Vane","Ste Braddock"],
    throwRule: "home"
  };
  const fx = blankFixture(meta);
  fx.id = "demo_night";   // fixed id so reloading ?demo=1 doesn't keep stacking up new mock nights
  fx.games.forEach((g, gi) => {
    const need = g.kind === "doubles" ? 2 : 1;
    g.home = Array.from({length: need}, (_, k) => meta.homeSquad[(gi + k) % meta.homeSquad.length]);
    g.away = Array.from({length: need}, (_, k) => meta.awaySquad[(gi + k) % meta.awaySquad.length]);
    g.started = true;
    let starter = defaultStart(fx, gi);
    while (!gameOver(g)){
      g.legs.push(demoLeg(g, starter));
      starter = other(starter);
    }
    g.won = legsWonBy(g,"home") > legsWonBy(g,"away") ? "home" : "away";
  });
  fx.finished = true;
  return fx;
}

/* =======================================================================
   SEEDED RESULTS - real nights that were already scored elsewhere. The
   leg-by-leg history was never captured, only the final report figures, so
   each game gets minimal leg shells (just enough for the right leg counts
   and W/L) plus a statOverride carrying the actual reported numbers. Fixed
   ids so these never duplicate across reloads or redeploys. Correct any
   figure the same way as any other night: tap its stats grid on the report
   screen. Add a new night by appending another entry to SEEDED_RESULTS.
   ======================================================================= */
function buildSeededFixture(id, meta, rows, unplayed){
  const fx = blankFixture(meta);
  fx.id = id;

  if (!unplayed && rows && rows.length){
    fx.games.forEach((g, gi) => {
      const row = rows[gi];
      if (!row) return;
      g.home = row.home; g.away = row.away; g.started = true;

      let starter = defaultStart(fx, gi);
      const [homeLegs, awayLegs] = row.legs;
      const order = Array(homeLegs).fill("home").concat(Array(awayLegs).fill("away"));
      order.forEach(side => {
        const leg = newLeg(starter);
        leg.won = side;
        g.legs.push(leg);
        starter = other(starter);
      });

      g.won = legsWonBy(g,"home") > legsWonBy(g,"away") ? "home" : "away";
      g.statOverride = { home: row.hs, away: row.as };
    });

    fx.finished = true;
  }
  return fx;
}

const SEEDED_RESULTS = [];
function matchDataToFixture(m){
  const toNum = (v, defaultVal = 0) => (v === "-" || v === null || v === undefined) ? defaultVal : (Number(v) || defaultVal);
  const toNullableNum = (v) => (v === "-" || v === null || v === undefined || Number.isNaN(Number(v))) ? null : Number(v);

  let isoDate = m.date;
  if (m.date && m.date.includes("/")){
    const parts = m.date.split("/");
    if (parts.length === 3){
      isoDate = parts[2] + "-" + parts[1].padStart(2, "0") + "-" + parts[0].padStart(2, "0");
    }
  }

  const gallonHome = (m.gallon && m.gallon.homePlayers && m.gallon.homePlayers !== "-") ? m.gallon.homePlayers.split("&").map(s => s.trim()).filter(Boolean) : [];
  const gallonAway = (m.gallon && m.gallon.awayPlayers && m.gallon.awayPlayers !== "-") ? m.gallon.awayPlayers.split("&").map(s => s.trim()).filter(Boolean) : [];
  const gallonHomeLegs = m.gallon ? toNum(m.gallon.homeLegs ?? m.gallonHomeScore ?? 0) : toNum(m.gallonHomeScore ?? 0);
  const gallonAwayLegs = m.gallon ? toNum(m.gallon.awayLegs ?? m.gallonAwayScore ?? 0) : toNum(m.gallonAwayScore ?? 0);

  const gallonHomeStats = (m.gallon && m.gallon.homeStats) ? {
    t100: toNum(m.gallon.homeStats.tons),
    t180: toNum(m.gallon.homeStats.max),
    ld: toNullableNum(m.gallon.homeStats.ld),
    high: toNullableNum(m.gallon.homeStats.hf),
    f9: toNum(m.gallon.homeStats.f9),
    avg: toNum(m.gallon.homeStats.avg)
  } : { t100:0, t180:0, ld:null, high:null, f9:0, avg:0 };

  const gallonAwayStats = (m.gallon && m.gallon.awayStats) ? {
    t100: toNum(m.gallon.awayStats.tons),
    t180: toNum(m.gallon.awayStats.max),
    ld: toNullableNum(m.gallon.awayStats.ld),
    high: toNullableNum(m.gallon.awayStats.hf),
    f9: toNum(m.gallon.awayStats.f9),
    avg: toNum(m.gallon.awayStats.avg)
  } : { t100:0, t180:0, ld:null, high:null, f9:0, avg:0 };

  const rows = [];
  rows.push({
    home: gallonHome,
    away: gallonAway,
    legs: [gallonHomeLegs, gallonAwayLegs],
    hs: gallonHomeStats,
    as: gallonAwayStats
  });

  (m.games || []).forEach(g => {
    rows.push({
      home: [g.homePlayer],
      away: [g.awayPlayer],
      legs: [g.homeScore, g.awayScore],
      hs: {
        t100: toNum(g.homeStats && g.homeStats.tons),
        t180: toNum(g.homeStats && g.homeStats.max),
        ld: toNullableNum(g.homeStats && g.homeStats.ld),
        high: toNullableNum(g.homeStats && g.homeStats.hf),
        f9: toNum(g.homeStats && g.homeStats.f9),
        avg: toNum(g.homeStats && g.homeStats.avg)
      },
      as: {
        t100: toNum(g.awayStats && g.awayStats.tons),
        t180: toNum(g.awayStats && g.awayStats.max),
        ld: toNullableNum(g.awayStats && g.awayStats.ld),
        high: toNullableNum(g.awayStats && g.awayStats.hf),
        f9: toNum(g.awayStats && g.awayStats.f9),
        avg: toNum(g.awayStats && g.awayStats.avg)
      }
    });
  });

  const homeSquad = Array.from(new Set(rows.flatMap(r => r.home))).filter(p => p && p !== "-");
  const awaySquad = Array.from(new Set(rows.flatMap(r => r.away))).filter(p => p && p !== "-");

  const meta = {
    date: isoDate,
    venue: m.venue || "Partington WMC",
    comp: m.matchType || "League",
    homeTeam: m.homeTeam,
    awayTeam: m.awayTeam,
    homeSquad,
    awaySquad,
    throwRule: "home"
  };

  return buildSeededFixture(m.id, meta, rows);
}

const SEED_VERSION = 13;
const KEY_SEED_VER = "chalk:seed_ver";

(async function boot(){
  const savedTheme = (await store.get(KEY_THEME)) || (typeof localStorage !== "undefined" ? localStorage.getItem(KEY_THEME) : null);
  if (savedTheme === "light" || savedTheme === "dark") S.theme = savedTheme;
  applyTheme();

  S.fixtures = (await store.get(KEY_FX)) || [];
  const sq = await store.get(KEY_SQ);
  if (sq) S.squads = sq;
  S.badge = (await store.get(KEY_BADGE)) || null;
  S.session = (await store.get(KEY_SESSION)) || { fixtureId: null, name: null, token: null };
  applyIcons();

  const currentSeedVer = (await store.get(KEY_SEED_VER)) || 0;
  const needsResync = currentSeedVer < SEED_VERSION;
  let changed = false;

  // Clean up any old placeholder fixture id if present
  const oldPlaceholderIdx = S.fixtures.findIndex(f => f.id === "2026-08-26-pwmc-trafford-b");
  if (oldPlaceholderIdx !== -1){
    S.fixtures.splice(oldPlaceholderIdx, 1);
    changed = true;
  }

  // Build fresh seeded fixtures from SEEDED_RESULTS and MATCHES_DATA
  const freshSeeds = [
    ...SEEDED_RESULTS.map(seed => buildSeededFixture(seed.id, seed.meta, seed.rows, seed.unplayed)),
    ...MATCHES_DATA.map(m => matchDataToFixture(m))
  ];

  // Sync seeded fixtures into local cache
  freshSeeds.forEach(fresh => {
    const idx = S.fixtures.findIndex(f => f.id === fresh.id || (f.date === fresh.date && ((f.homeTeam === fresh.homeTeam && f.awayTeam === fresh.awayTeam) || (f.date === "2026-08-26"))));
    if (idx === -1){
      S.fixtures.push(fresh);
      changed = true;
    } else if (needsResync){
      // Update with fresh dataset
      S.fixtures[idx] = fresh;
      changed = true;
    }
  });

  // Deduplicate if any fixture had duplicate IDs across upgrades
  const seenIds = new Set();
  const deduped = [];
  S.fixtures.forEach(f => {
    if (!seenIds.has(f.id)){
      seenIds.add(f.id);
      deduped.push(f);
    } else {
      changed = true;
    }
  });
  S.fixtures = deduped;

  // Sort fixtures by date descending
  S.fixtures.sort((a,b) => {
    const da = a.date ? new Date(a.date + "T12:00:00").getTime() : (a.savedAt || 0);
    const db = b.date ? new Date(b.date + "T12:00:00").getTime() : (b.savedAt || 0);
    return (db - da) || ((b.savedAt || 0) - (a.savedAt || 0));
  });

  if (changed || needsResync){
    await store.set(KEY_FX, S.fixtures);
    await store.set(KEY_SEED_VER, SEED_VERSION);
  }

  if (DEMO_MODE){
    let demo = S.fixtures.find(f => f.id === "demo_night");
    if (!demo){ demo = buildDemoFixture(); S.fixtures.unshift(demo); await persist(demo); }
    S.viewing = demo; S.view = "view";
  }

  // Opened via a shared "?watch=<fixture id>" link - fetch the live copy
  // from Supabase and follow along, rather than showing the normal home
  // screen (which only knows about fixtures scored on this device).
  const watchId = new URLSearchParams(location.search).get("watch");
  if (watchId && sb){
    try {
      const { data: row } = await sb.from("fixtures").select("data,locked_by,locked_at").eq("id", watchId).single();
      if (row && row.data){
        S.viewing = row.data;
        S.watchId = watchId;
        S.view = "watch";
        subscribeFixture(watchId);
      } else {
        toast("Can't find that match - the link may be wrong or it hasn't gone live yet");
      }
    } catch(e){ toast("No connection - couldn't load the live match"); }
  }

  function handleHash(){
    const h = window.location.hash || "";
    if (h.startsWith("#/player/")){
      const slug = h.replace("#/player/", "");
      const found = getPlayerBySlugOrName(slug);
      if (found){
        S.selectedPlayer = found.player;
        S.playerPrevView = (S.view !== "player" && S.view) ? S.view : "smd";
        S.view = "player";
        render();
      }
    } else if (h === "#/smd"){
      S.view = "smd";
      render();
    } else if (h === "#/results"){
      S.view = "results";
      render();
    }
  }
  handleHash();
  window.addEventListener("hashchange", handleHash);

  render();
  if (!S.badge){                     // look for a shared logo.png without blocking startup
    const site = await siteLogo();
    if (site){ S.badge = site; applyIcons(); render(); }
  }

  // Keep the scoring lock fresh while actively holding it; a dropped phone
  // (tab closed, signal lost) just stops heartbeating and the lock goes
  // stale after 90s, per claim_scoring()'s check - nothing to clean up here.
  setInterval(() => {
    if (sb && S.session.token && S.session.fixtureId){
      sb.rpc("heartbeat_scoring", { p_id: S.session.fixtureId, p_token: S.session.token }).catch(() => {});
    }
  }, 30000);
})();
